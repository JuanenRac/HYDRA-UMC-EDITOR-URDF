name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
      - name: Install and run the real Python test suite
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/ -q
      - name: Lint and type-check
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: |
          python -m pip install -r requirements-dev.txt ruff==0.17.1 mypy==2.4.0
          python -m ruff check --select F,E9,B hydra_editor_urdf tests tools main.py qt_editor_urdf.py
          python -m mypy --ignore-missing-imports hydra_editor_urdf qt_editor_urdf.py main.py
